# Alembic Configuration File

[alembic]
# path to migration scripts
scriptLocation = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(asctime)s_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
pythonpath = .

# timezone to use when rendering the date
# within the "datesim" function (available in the `env.py`)
# when the -z/--timezone argument is passed to Alembic as well.
# If omitted, datetimes will be rendered for UTC without timezone info.
timezone =

# max length of characters to apply to the
# "slug" field when generating migration file
# names.  The default value is 40 chars
# which was the max in Alembic 0.x
# use 40 to stay on 0.x behavior; note that
# backward compatibility comes at the cost of
# an XXX partial string on new files.
mnemonic_length = 40

# Whether to run migrations in "batch mode"
# (necessary to support certain databases
# that do not support transactions for schema
# changes like SQLite). The default is False.
batch_mode = False

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
